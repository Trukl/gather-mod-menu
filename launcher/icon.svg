<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#4b3bd6"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3e0ff"/>
    </linearGradient>
    <mask id="notch">
      <rect x="-400" y="-400" width="800" height="800" fill="#fff"/>
      <rect x="-48" y="-330" width="96" height="150" rx="10" fill="#000"/>
    </mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1d1260" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.22">
    <rect x="226" y="226" width="56" height="56" rx="8"/>
    <rect x="296" y="226" width="56" height="56" rx="8"/>
    <rect x="226" y="296" width="56" height="56" rx="8"/>
    <rect x="742" y="672" width="56" height="56" rx="8"/>
    <rect x="742" y="742" width="56" height="56" rx="8"/>
    <rect x="672" y="742" width="56" height="56" rx="8"/>
  </g>
  <g transform="translate(512 512) rotate(45)" filter="url(#shadow)" fill="url(#metal)">
    <g mask="url(#notch)">
      <circle cx="0" cy="-200" r="128"/>
    </g>
    <rect x="-50" y="-110" width="100" height="380" rx="50"/>
    <circle cx="0" cy="215" r="20" fill="#6c5ce7"/>
  </g>
</svg>
